name: CI Qualite et Securite

on:
  push:
    branches: [ main, develop, pipeline ]
  pull_request:
    branches: [ main, develop, pipeline ]

permissions:
  contents: read
  pull-requests: read

jobs: 
  # --- Etape 1 : Qualite du code et Secrets ---
  lint-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Analyse Ruff
        id: ruff
        run: |
          pip install ruff
          ruff check .
        continue-on-error: false

      - name: Scan Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Scan TruffleHog
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: false

      - name: Resume Etape 1
        if: always()
        run: |
          echo "## Recapitulatif Qualite et Secrets" >> $GITHUB_STEP_SUMMARY
          echo "| Outil | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Ruff | ${{ steps.ruff.outcome == 'success' && 'Succes' || 'Erreur' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ${{ steps.gitleaks.outcome == 'success' && 'Succes' || 'Alerte' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TruffleHog | ${{ steps.trufflehog.outcome == 'success' && 'Succes' || 'Alerte' }} |" >> $GITHUB_STEP_SUMMARY

  # --- Etape 2 : Analyse statique (SAST & SCA) ---
  sast-and-sca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Scan Bandit
        id: bandit
        run: |
          pip install bandit
          bandit -r . -ll
        continue-on-error: false

      - name: Pip-audit
        id: pipaudit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
        continue-on-error: false

      - name: Resume Etape 2
        if: always()
        run: |
          echo "## Recapitulatif SAST et SCA" >> $GITHUB_STEP_SUMMARY
          echo "| Outil | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit (SAST) | ${{ steps.bandit.outcome == 'success' && 'Succes' || 'Vulnerabilites detectees' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pip-audit (SCA) | ${{ steps.pipaudit.outcome == 'success' && 'Succes' || 'Dependances vulnerables' }} |" >> $GITHUB_STEP_SUMMARY

  # --- Etape 3 : Securite Docker ---
  docker-security:
    runs-on: ubuntu-latest
    needs: [lint-and-scan, sast-and-sca] 
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Trivy (Config IaC)
        id: trivy_config
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
        continue-on-error: false

      - name: Build Image Docker
        run: docker build -t twitter_g:${{ github.sha }} .

      - name: Trivy (Image)
        id: trivy_image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'twitter_g:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH'
        continue-on-error: true

      - name: Resume Etape 3
        if: always()
        run: |
          echo "## Recapitulatif Securite Docker" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Resultat |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy (Config) | ${{ steps.trivy_config.outcome == 'success' && 'Conforme' || 'Non-conforme' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy (Image) | ${{ steps.trivy_image.outcome == 'success' && 'Propre' || 'Vulnerabilites detectees' }} |" >> $GITHUB_STEP_SUMMARY

  # --- Etape 4 : Scan Dynamique et Push DockerHub ---
  dast-and-deploy:
    runs-on: ubuntu-latest
    needs: [docker-security]
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Lancement Application
        run: |
          docker build -t twitter_g:test .
          docker run -d -p 8000:8000 --name webapp twitter_g:test
          sleep 15 

      - name: Scan Wapiti
        id: wapiti
        run: |
          pip install wapiti3
          mkdir results
          wapiti -u http://localhost:8000 -f html -o results/wapiti_report.html
        continue-on-error: false

      # --- CHALLENGE : OWASP ZAP ---
      - name: Creation du repertoire de travail ZAP
        run: |
          mkdir -p zap/wrk
          chmod -R 777 zap/wrk

      # --- CHALLENGE : OWASP ZAP ---
      - name: Correction des droits pour ZAP
        run: |
          # On cree le dossier attendu et on donne les droits full
          sudo mkdir -p $(pwd)/zap/wrk
          sudo chown -R 1000:1000 $(pwd)
          sudo chmod -R 777 $(pwd)

      # --- CHALLENGE : OWASP ZAP ---
      - name: Scan OWASP ZAP
        id: zap
        run: |
          # 1. On recupere l'IP de l'application
          APP_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' webapp)
          echo "Cible ZAP : http://$APP_IP:8000"
          
          # 2. On cree le dossier de rapport avec les droits full
          mkdir -p $(pwd)/zap/wrk
          chmod -R 777 $(pwd)/zap/wrk
          
          # 3. On lance ZAP manuellement en mode root pour eviter tout conflit
          docker run --rm -v $(pwd)/zap/wrk:/zap/wrk/:rw -u root \
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t http://$APP_IP:8000 -g gen.conf -r report.html
        continue-on-error: false

      # Exportation manuelle du rapport ZAP (puisqu'on ne passe plus par l'action officielle)
      - name: Upload Artefact ZAP
        uses: actions/upload-artifact@v4
        with:
          name: Rapport-ZAP
          path: zap/wrk/report.html

      - name: Upload Artefact Wapiti
        uses: actions/upload-artifact@v4
        with:
          name: Rapport-Wapiti
          path: results/wapiti_report.html

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push DockerHub
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ombrosa/twitter_g:latest
            ombrosa/twitter_g:${{ github.sha }}

      - name: Resume Etape 4
        if: always()
        run: |
          echo "## Recapitulatif DAST et Deploiement" >> $GITHUB_STEP_SUMMARY
          echo "| Action | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| DAST (Wapiti) | ${{ steps.wapiti.outcome == 'success' && 'Aucune faille majeure' || 'Alertes detectees' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OWASP ZAP (Challenge) | ${{ steps.zap.outcome == 'success' && 'Termine' || 'Failles detectees' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploiement DockerHub | ${{ steps.push.outcome == 'success' && 'Reussi' || 'Echec' }} |" >> $GITHUB_STEP_SUMMARY 