name: CI Quality and Secrets

on:
  push:
    branches: [ main, develop, pipeline ]
  pull_request:
    branches: [ main, develop, pipeline ]

permissions:
  contents: read
  pull-requests: read

jobs: 
  # --- JOB 1 : QUALITÉ & SECRETS (Lab 1) ---
  lint-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Ruff (Linting)
        run: |
          pip install ruff
          ruff check .

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Alternative Secret Scan (TruffleHog)"
        # Correction : Utilisation de l'action officielle valide
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # --- JOB 2 : SAST & SCA (Lab 2) ---
  sast-and-sca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Bandit Scan (SAST)
        run: |
          pip install bandit
          bandit -r . -ll

      - name: Pip-audit (SCA)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: "Semgrep (Challenge: Policy as Code)"
        run: |
          pip install semgrep
          semgrep --config .semgrep.yml .

  # --- JOB 3 : DOCKER BUILD & SCAN (Lab 3) ---
  docker-security:
    runs-on: ubuntu-latest
    needs: [lint-and-scan, sast-and-sca] 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: "Trivy: Scan Pré-build (IaC)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Build Docker Image
        run: docker build -t my-app:${{ github.sha }} .

      - name: "Trivy: Scan Post-build (Image)"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'


# --- JOB 4 : DAST et Deploy  ---
  dast-and-deploy:
    runs-on: ubuntu-latest
    needs: [docker-security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. BONUS : Gestion de docker-compose dans la pipeline
      - name: Start services with Docker Compose
        run: |
          docker-compose up -d
          sleep 20 # On laisse un peu de temps à l'app et ses services (DB, etc.)

      # 2. BONUS : Remplacer Nikto par Wapiti
      - name: Run Wapiti Scan
        run: |
          # Créer un dossier pour les résultats
          mkdir results
          # On lance Wapiti contre le service défini dans docker-compose (généralement sur le port 8000 ou 8080)
          # -f html : format du rapport / -o : dossier de sortie
          docker run --rm --network="host" -v $(pwd)/results:/results \
          vaimu/wapiti wapiti -u http://localhost:8000 -f html -o /results/wapiti_report.html
        continue-on-error: true

      # 3. BONUS : Exporter le résultat avec un artefact
      - name: Upload Wapiti Report
        uses: actions/upload-artifact@v4
        with:
          name: DAST-Wapiti-Report
          path: results/wapiti_report.html

      # 4. Connexion à DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Push vers DockerHub
      - name: Build and Push to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ombrosa/twitter_g:latest
            ombrosa/twitter_g:${{ github.sha }}