name: CI Quality and Secrets

on:
  push:
    branches: [ main, develop, pipeline ]
  pull_request:
    branches: [ main, develop, pipeline ]

permissions:
  contents: read
  pull-requests: read

jobs: 
  # --- JOB 1 : QUALITÉ & SECRETS (Lab 1) ---
  lint-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Ruff (Linting)
        run: |
          pip install ruff
          ruff check .

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Alternative Secret Scan (TruffleHog)"
        # Correction : Utilisation de l'action officielle valide
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # --- JOB 2 : SAST & SCA (Lab 2) ---
  sast-and-sca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Bandit Scan (SAST)
        run: |
          pip install bandit
          bandit -r . -ll

      - name: Pip-audit (SCA)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: "Semgrep (Challenge: Policy as Code)"
        run: |
          pip install semgrep
          semgrep --config .semgrep.yml .

  # --- JOB 3 : DOCKER BUILD & SCAN (Lab 3) ---
  docker-security:
    runs-on: ubuntu-latest
    needs: [lint-and-scan, sast-and-sca] 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: "Trivy: Scan Pré-build (IaC)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Build Docker Image
        run: docker build -t my-app:${{ github.sha }} .

      - name: "Trivy: Scan Post-build (Image)"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

# --- JOB 4 : DAST et Deploy (Lab 4 - Simple) ---
  dast-and-deploy:
    runs-on: ubuntu-latest
    needs: [docker-security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Build et lancement local pour le scan DAST
      - name: Start Application for DAST
        run: |
          docker build -t twitter_g:test .
          docker run -d -p 8080:8080 --name webapp twitter_g:test
          sleep 10 

      # 2. DAST avec Nikto (Obligatoire)
      - name: Run Nikto Scan
        run: |
          docker run --rm --network="host" sullo/nikto -h http://localhost:8080
        continue-on-error: true

      # 3. Connexion à DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Push vers ombrosa/twitter_g (Obligatoire)
      - name: Build and Push to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # On utilise ici le nom exact de ton repository DockerHub
          tags: |
            ombrosa/twitter_g:latest
            ombrosa/twitter_g:${{ github.sha }}