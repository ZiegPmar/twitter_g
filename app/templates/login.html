<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <title>G connexion</title>
</head>

<body>
    <a>
        <img src="{{ url_for('static', filename='img/logo.webp') }}" alt="Logo" class="logo"/>
    </a>

    <div class="login_page">
        <form method="POST" action="{{ url_for('main.connexion') }}">

            <div class="username">
                <h1>Identifiant :</h1>
                <input type="text" name="username" placeholder="Entrez votre nom d'utilisateur" required>
            </div>

            <div class="password">
                <h1>Mot de passe :</h1>
                <input type="password" name="password" placeholder="Entrez votre mot de passe" required>
            </div>

            {% if error %}
                <p class="error-msg">{{ error }}</p>
            {% endif %}

            <button type="submit">Se connecter</button>
        </form>
    </div>

    <div class="create_account">
        <a href="{{ url_for('main.inscription') }}" class="clickable-text">Créer un compte</a>
    </div>
</body>
</html>
