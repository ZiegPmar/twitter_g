<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/edit_profil.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar-left.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar-right.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">a
    <title>Edit Profil</title>
</head>
<body>
    <nav class="sidebar-sommaire">
        <a href="home.html" class="logo">
            <img src="{{ url_for('static', filename='img/logo.webp') }}" alt="Logo"/>
        </a>

        <div class="sommaire-section">
            <a class="text-sidebar" href="home.html"><i class="fa-solid fa-house"></i> Home</a>

            <a class="text-sidebar" href="#"><i class="fa-solid fa-user-group"></i> Amis</a>

            <a class="text-sidebar" href="#"><i class="fa-solid fa-envelope"></i> Message</a>

            <a class="text-sidebar" href="#"><i class="fa-solid fa-heart"></i> Like</a>
        </div>

        <div class="profil-section">
            <img src="{{ url_for('static', filename='img/Avatar/' + current_user.avatar_url) if current_user.avatar_url else url_for('static', filename='img/Avatar/default_avatar.png') }}" alt="pdp" />
            <a class="text-sidebar" href="{{ url_for('main.profile', username=current_user['username']) }}">{{ current_user['display_name'] }} </a>
        </div>
    </nav>

    

    <div class="main">
    <form action="{{ url_for('main.update_profile') }}" method="POST" enctype="multipart/form-data">
        <div class="profile-nav-header">
            <div class="header-left-group">
                <a href="{{ url_for('main.monprofil') }}" class="back-btn"><i class="fa-solid fa-xmark"></i></a>
                <h2 class="header-title">Éditer le profil</h2>
            </div>
            <button type="submit" class="save-btn">Enregistrer</button>
        </div>

        <div class="profile-container">
            <div class="banner edit-mode">
                {% if current_user.banner_url %}
                    <img src="{{ url_for('static', filename='img/banniere/' + current_user.banner_url) }}" alt="Banner">
                {% else %}
                    <div class="banner-placeholder"></div> 
                {% endif %}
                <label for="banner_input" class="camera-icon"><i class="fa-solid fa-camera"></i></label>
                <input type="file" id="banner_input" name="banner" accept="image/*" hidden>
            </div>
    
            <div class="profile-info-section">
                <div class="profile-header">
                    <div class="avatar-container edit-mode">
                        <img src="{{ url_for('static', filename='img/Avatar/' + current_user.avatar_url) if current_user.avatar_url else url_for('static', filename='img/Avatar/default_avatar.png') }}" class="profile-pdp">
                        <label for="avatar_input" class="camera-icon"><i class="fa-solid fa-camera"></i></label>
                        <input type="file" id="avatar_input" name="avatar" accept="image/*" hidden>
                    </div>
                </div>
    
                <div class="user-details-edit">
                    <div class="input-group">
                        <label for="display_name">Nom</label>
                        <input type="text" id="display_name" name="display_name" value="{{ current_user.display_name }}">
                    </div>
                
                    <div class="input-group">
                        <label for="bio">Bio</label>
                        <textarea id="bio" name="bio" rows="4">{{ current_user.bio if current_user.bio else '' }}</textarea>
                    </div>
                
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" value="{{ current_user.email if current_user.email else '' }}" placeholder="Ajouter votre email">
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

    <nav class="sidebar-right-sommaire">
        <div class="sommaire-right-section">

            <div class="weather-card">
                <div class="weather-header">
                    <span class="city">Lyon</span>
                    <span class="date" id="current-date">Aujourd'hui</span>
                </div>
                <div class="weather-main">
                    <div class="temp-container">
                        <span id="temp-affichage">--</span><span class="unit">°C</span>
                    </div>
                </div>
                <div class="weather-icon">☁️</div>
                <div class="weather-details">
                    <div class="detail-item">
                        <span class="label">VENT</span>
                        <span id="vent-affichage">-- km/h</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <script src="{{ url_for('static', filename='javascript/meteo.js') }}"></script>
</body>
</html>
