events { worker_connections 1024; }

http {
    upstream flask_app {
        # Le nom "app" correspond au nom du service dans docker-compose
        server app:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Optionnel : Servir les fichiers statiques directement par Nginx pour plus de perf
        location /static/ {
            alias /app/static/;
        }
    }
}