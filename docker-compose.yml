services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    restart: always
    environment:
      - FLASK_DEBUG=false # Désactive le debug en prod
      - SECRET_KEY=h4ufhuzehphduhs144fhuehôùsgdfpieh44vsdph5
      - PYTHONUNBUFFERED=1
    # On n'expose plus le port 8000 au monde extérieur, seul Nginx y touchera
    expose:
      - "8000"
    deploy:
      replicas: 3 # Lance 3 instances par défaut

  proxy:
    image: nginx:latest
    container_name: g_twitter_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: always